<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<h2>Internship Form</h2>

<form>

    <!-- First Name -->
    <label for="first-name-input">First Name</label>
    <input type="text" id="first-name-input"  required />

    <br>

    <!-- Last Name -->
    <label for="last-name-input">Last Name</label>
    <input type="text" id="last-name-input"  required />

    <br>

    <!-- Email -->
    <label for="email-input" >Email Address</label>
    <input type="email" id="email-input"  required />

    <br>

    <!-- College -->
    <label for="college-input">College</label>
    <input type="text" id="college-input"  required />

    <br>

    <!-- Graduation Year -->
    <label for="grad-year-select">Graduation Year</label>
    <select id="grad-year-select"  required>
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
    </select>

    <br>

    <!-- Roll No -->
    <label for="roll-no-input" >Roll No</label>
    <input type="text" id="roll-no-input"  required />

    <br>

    <!-- Checkbox -->
    <div class="form-check">
        <input type="checkbox" id="conditions-checkbox"  required />
        <label for="conditions-checkbox">
            Agree to terms and conditions
        </label>
    </div>

    <br>

    <!-- Submit -->
    <button type="submit" class="btn btn-primary">Submit Form</button>

</form>

</body>

</html>
