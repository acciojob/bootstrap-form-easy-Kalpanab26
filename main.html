<body>
	<h2>Internship Form</h2>
<form>
	
	<label for="firstname">First Name</label>
	<input type="name" id="first-name-input" required/>

	
	<label for="lastname">Last Name</label>
	<input type="name" id="last-name-input" required/>

	
	<label for="email">Email Address</label>
	<input type="email" id="email-input" required/>

	
	<label for="college">College</label>
	<input type="text" id="college-input" required/>

	
	<label for="firstname" >Graduation Year
	<select id="first-name-input">
		<option>2020</option>
		<option>2021</option>
		<option>2022</option>
		<option>2023</option>
	</select>
	</label>
	

	
	<label for="rollno">Roll No</label>
	<input type="number" id=roll-no-input" required/>

	<label for="conditions-checkbox">
		<input type="checkbox" id="conditions-checkbox" 
			   required/>
		
		Agree to terms and conditions
	</label>
	<submit>Submit Form</submit>
</form>



	
	<!-- the entire body must be written by student -->
